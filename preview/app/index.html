<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1F2A44" />
    <title>AJIN, gestão da associação</title>

    <style>
      /* =================================================================
         A abertura.

         A animação oficial da associação, a mesma que abre o site. Está no
         HTML, e não dentro do app, porque precisa aparecer antes de
         qualquer JavaScript rodar: entre clicar em "Acessar o app" e a tela
         de login existir há alguns instantes, e sem nada aqui esses
         instantes são uma tela branca.

         O arquivo é servido à parte, não embutido: embutido, ele viraria
         1,2 MB de texto no HTML e atrasaria justamente o que veio adiantar.
         ================================================================= */
      html, body { margin: 0; height: 100%; background: #fbf8f0; }

      #partida {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #fbf8f0;
        cursor: pointer;
        transition: opacity 520ms cubic-bezier(0.23, 1, 0.32, 1);
      }
      #partida[data-saindo] { opacity: 0; pointer-events: none; }
      #partida video { width: 100%; height: 100%; object-fit: cover; }

      #partida .pular {
        position: absolute;
        right: 22px;
        bottom: 20px;
        font: 10.5px ui-monospace, Menlo, monospace;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: rgba(31, 42, 68, 0.5);
        opacity: 0;
        animation: mostra 500ms ease-out 1600ms forwards;
      }
      @keyframes mostra { to { opacity: 1; } }

      @media (prefers-reduced-motion: reduce) {
        #partida { display: none; }
      }
    </style>
    <script type="module" crossorigin src="/preview/app/assets/app.js?v=20260810152146"></script>
    <link rel="stylesheet" crossorigin href="/preview/app/assets/app.css?v=20260810152146">
  </head>

  <body>
    <div id="root"></div>

    <div id="partida" role="status" aria-label="Abrindo o AJIN">
      <video id="filme" muted playsinline preload="auto" src="./ajin.mp4"></video>
      <span class="pular">clique para pular</span>
    </div>

  </body>
</html>
