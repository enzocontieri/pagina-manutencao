<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Página não encontrada | AJIN</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/png" sizes="32x32" href="/marca/icone-32.png" />
<link rel="apple-touch-icon" href="/marca/icone-180.png" />
<style>
  /* Endereço que não existe: a mesma placa da marca, com o caminho de volta
     e os telefones, para quem chega precisando de ajuda não ficar sem saída. */
  @font-face { font-family: 'Inter'; font-weight: 400 900; font-display: swap; src: url('/fontes/inter-latin.woff2') format('woff2'); }
  :root { --navy: #1f2a44; --mar: #1f5bca; --onda: #f28c38; --areia: #e9e2d3; --papel: color-mix(in srgb, var(--areia) 90%, var(--onda)); }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px 16px; background: var(--papel); color: var(--navy); font-family: 'Inter', system-ui, sans-serif; }
  .placa { position: relative; width: min(760px, 100%); border-radius: 28px; background: var(--navy); color: var(--areia); overflow: hidden; isolation: isolate; padding: clamp(32px, 6vw, 64px) clamp(24px, 6vw, 64px) clamp(120px, 16vw, 170px); }
  .placa img { height: 40px; width: auto; max-width: none; margin-bottom: 36px; }
  .circulo { position: absolute; width: 220px; aspect-ratio: 1; right: -80px; top: -110px; border-radius: 50%; border: 2px solid var(--mar); z-index: -1; }
  .fundo { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 40%; z-index: -1; }
  small { display: block; font-size: 14px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--onda); margin-bottom: 14px; }
  h1 { margin: 0; font-size: clamp(36px, 6vw, 64px); font-weight: 900; line-height: 1; letter-spacing: -0.045em; }
  p { margin: 18px 0 0; font-size: 18px; line-height: 1.55; color: color-mix(in srgb, var(--areia) 86%, var(--navy)); max-width: 44ch; }
  .acoes { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px; }
  a.btn { display: inline-flex; align-items: center; min-height: 54px; padding: 0 26px; border-radius: 100px; font-size: 17px; font-weight: 700; text-decoration: none; background: var(--onda); color: var(--navy); }
  a.btn--linha { background: transparent; color: var(--areia); border: 1.5px solid color-mix(in srgb, var(--areia) 40%, transparent); }
</style>
</head>
<body>
  <main class="placa">
    <span class="circulo" aria-hidden="true"></span>
    <img src="/marca/ajin-branco.png" alt="AJIN" width="101" height="40" />
    <small>Página não encontrada</small>
    <h1>Este endereço não existe mais.</h1>
    <p>O site da AJIN mudou. Volte para a página inicial ou fale com a gente: escritório (48) 3282-1590, Bairro seguro 24h (48) 3266-4300.</p>
    <div class="acoes">
      <a class="btn" href="/">Ir para a página inicial</a>
      <a class="btn btn--linha" href="https://wa.me/5548999497419">Falar no WhatsApp</a>
    </div>
    <svg class="fundo" viewBox="0 0 1200 300" preserveAspectRatio="none" aria-hidden="true"><path fill="#f28c38" d="M0 170 C 300 80, 620 60, 900 140 S 1150 230, 1200 210 V300 H0z"/><path fill="#e9e2d3" d="M0 230 C 300 140, 640 130, 900 200 S 1150 280, 1200 260 V300 H0z"/></svg>
  </main>
</body>
</html>
